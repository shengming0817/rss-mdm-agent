[workspace]
members = ["crates/platform-sso", "apps/platform-sso-extension", "apps/windows-credential-provider", "apps/agent-service", "crates/agent-client", "crates/execution-runner", "crates/execution-ipc", "crates/native-process", "crates/platform-private-storage", "crates/platform-credentials", "crates/installation-security", "crates/device-access", "apps/desktop/src-tauri", "crates/execution-contract", "crates/ai-session-contract", "crates/execution-interaction", "crates/execution-capability", "crates/execution-admission", "crates/execution-approval", "crates/execution-lifecycle", "crates/script-plan", "crates/execution-mcp", "crates/execution-sqlite", "crates/execution-app"]
exclude = ["vendor/tauri-plugin-wdio-webdriver"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
rss-mdm-agent-wire = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-mdm", rev = "e0c6351688aaa1a43666b681ab4860b2fedcb6d9" }
zeroize = { version = "=1.8.2", features = ["serde"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
x509-cert = "=0.2.5"
der = { version = "=0.7.10", features = ["alloc", "derive", "oid"] }
spki = { version = "=0.7.3", features = ["alloc"] }

tauri = { version = "=2.11.2", features = [] }
tauri-build = { version = "=2.6.2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
serde_json_canonicalizer = "=0.3.2"
jsonschema = { version = "=0.33.0", default-features = false }
url = "=2.5.8"
rmcp = { version = "=3.4.0", default-features = false, features = ["server"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
futures-util = "=0.3.34"
rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled"] }

# Native development still verifies complete protected images on every IPC request.
# Keep hashing throughput close to the production profile without weakening those checks.
[profile.dev.package.sha2]
opt-level = 3
