[workspace]
members = ["apps/agent-service", "crates/agent-client", "crates/execution-runner", "crates/native-process", "crates/platform-private-storage", "crates/platform-credentials", "crates/installation-security", "apps/desktop/src-tauri", "crates/execution-contract", "crates/ai-session-contract", "crates/execution-interaction", "crates/execution-capability", "crates/execution-admission", "crates/service-catalog", "crates/execution-approval", "crates/execution-lifecycle", "crates/script-plan", "crates/execution-mcp", "crates/execution-sqlite", "crates/execution-app"]
exclude = ["vendor/tauri-plugin-wdio-webdriver"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
tauri = { version = "=2.11.2", features = [] }
tauri-build = { version = "=2.6.2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
serde_json_canonicalizer = "=0.3.2"
jsonschema = { version = "=0.33.0", default-features = false }
url = "=2.5.8"
rmcp = { version = "=3.4.0", default-features = false, features = ["server"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
futures-util = "=0.3.34"
rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled"] }

# Native development still verifies complete protected images on every IPC request.
# Keep hashing throughput close to the production profile without weakening those checks.
[profile.dev.package.sha2]
opt-level = 3
