[package]
name = "rss-mdm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rssmdm"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
execution-contract = { path = "../../crates/execution-contract" }
execution-app = { path = "../../crates/execution-app" }
execution-ipc = { path = "../../crates/execution-ipc" }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.26.0", features = ["v4"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
