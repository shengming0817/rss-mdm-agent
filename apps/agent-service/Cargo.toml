[package]
name = "agent-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rss-execution-service"
path = "src/main.rs"

[dependencies]
jsonschema.workspace = true
rss-mdm-agent-wire.workspace = true
rustls.workspace = true
script-plan = { path = "../../crates/script-plan" }
platform-private-storage = { path = "../../crates/platform-private-storage" }
platform-credentials = { path = "../../crates/platform-credentials" }
agent-client = { path = "../../crates/agent-client" }
execution-interaction = { path = "../../crates/execution-interaction" }
execution-app = { path = "../../crates/execution-app" }
execution-contract = { path = "../../crates/execution-contract" }
execution-admission = { path = "../../crates/execution-admission" }
execution-approval = { path = "../../crates/execution-approval" }
execution-capability = { path = "../../crates/execution-capability" }
execution-lifecycle = { path = "../../crates/execution-lifecycle" }
execution-sqlite = { path = "../../crates/execution-sqlite" }
execution-ipc = { path = "../../crates/execution-ipc" }
execution-runner = { path = "../../crates/execution-runner" }
native-process = { path = "../../crates/native-process" }
installation-security = { path = "../../crates/installation-security" }
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "process", "io-util", "time"] }
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
base64 = "=0.23.1"
zeroize = "=1.8.2"
fs2 = "=0.4.3"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_System_Com"] }
windows = { version = "=0.61.3", features = ["ApplicationModel", "Storage", "Foundation", "Management_Deployment", "System", "Win32_System_WinRT", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_System_Wmi", "Win32_System_UpdateAgent", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFirewall", "Win32_Management_MobileDeviceManagementRegistration", "Win32_System_RemoteDesktop", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Services", "Win32_Security", "Win32_System_Rpc", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
x509-cert.workspace = true
der.workspace = true
spki.workspace = true
execution-app = { path = "../../crates/execution-app", features = ["test-support"] }
execution-sqlite = { path = "../../crates/execution-sqlite", features = ["test-support"] }
execution-runner = { path = "../../crates/execution-runner", features = ["test-support"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
axum = "=0.8.9"
ring = "=0.17.14"
rusqlite.workspace = true

[build-dependencies]
cc = "=1.4.5"
