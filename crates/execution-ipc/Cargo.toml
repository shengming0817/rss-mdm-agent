[package]
name = "execution-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
execution-contract = { path = "../execution-contract" }
execution-app = { path = "../execution-app" }
installation-security = { path = "../installation-security" }
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "sync", "macros"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_Console", "Win32_System_EventLog"] }

[build-dependencies]
cc = "=1.4.5"
