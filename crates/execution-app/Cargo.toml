[package]
name = "execution-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Explicit fixtures use the same application and rule core as production.
test-support = []

[dependencies]
execution-contract = { path = "../execution-contract" }
execution-capability = { path = "../execution-capability" }
execution-admission = { path = "../execution-admission" }
execution-approval = { path = "../execution-approval" }
execution-lifecycle = { path = "../execution-lifecycle" }
execution-interaction = { path = "../execution-interaction" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
execution-sqlite = { path = "../execution-sqlite", features = ["test-support"] }
rusqlite.workspace = true

[[example]]
name = "task-details-fixtures"
required-features = ["test-support"]

[lints.clippy]
cognitive_complexity = "warn"
