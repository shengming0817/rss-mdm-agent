[package]
name = "agent-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, features = ["uuid1"] }
uuid = { version = "=1.26.0", features = ["serde"] }
thiserror.workspace = true
jsonschema.workspace = true
base64 = "=0.23.1"
zeroize.workspace = true
ordered-float = { version = "=2.10.1", features = ["serde"] }

[dev-dependencies]
toml = "=1.1.5"
sha2.workspace = true
typify = "=0.8.0"
schemars_codegen = { package = "schemars", version = "=0.8.22" }
syn = { version = "=2.0.119", features = ["full", "visit-mut"] }
quote = "=1.0.47"
