[package]
name = "agent-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ring = "=0.17.14"
zeroize.workspace = true
rustls.workspace = true
x509-cert.workspace = true
x509-parser = { version = "=0.18.1", features = ["verify"] }
der.workspace = true
spki.workspace = true
base64 = "=0.23.1"
agent-api.workspace = true
execution-contract = { path = "../execution-contract" }
platform-private-storage = { path = "../platform-private-storage" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
thiserror.workspace = true
sha2.workspace = true
url.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }
futures-util.workspace = true
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
fs2 = "=0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
axum = "=0.8.9"
base64 = "=0.23.1"

[lints.clippy]
cognitive_complexity = "warn"
