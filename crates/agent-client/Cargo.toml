[package]
name = "agent-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rss-mdm-agent-wire = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-mdm", rev = "574d11eec526f31fbc6ccc7a24d5fccddd6df8db", version = "=5.0.0" }
execution-app = { path = "../execution-app" }
execution-contract = { path = "../execution-contract" }
execution-sqlite = { path = "../execution-sqlite" }
execution-lifecycle = { path = "../execution-lifecycle" }
native-process = { path = "../native-process" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
thiserror.workspace = true
sha2.workspace = true
url.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }
futures-util.workspace = true
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
fs2 = "=0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
axum = "=0.8.9"
ring = "=0.17.14"
base64 = "=0.23.1"
execution-admission = { path = "../execution-admission" }
execution-approval = { path = "../execution-approval" }
execution-capability = { path = "../execution-capability" }

[lints.clippy]
cognitive_complexity = "warn"
