[package]
name = "windows-passkey-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
passkey-vault = { path = "../passkey-vault" }
platform-private-storage = { path = "../platform-private-storage" }
passkey-types = "=0.6.0"
passkey-crypto = "=0.1.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
ring = "=0.17.14"
uuid = { version = "=1.26.0", features = ["v4"] }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx"] }
