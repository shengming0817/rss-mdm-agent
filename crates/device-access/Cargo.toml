[package]
name = "device-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rss-mdm-agent-wire.workspace = true
platform-private-storage = { path = "../platform-private-storage" }
platform-credentials = { path = "../platform-credentials" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
ring = "=0.17.14"
base64 = "=0.23.1"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Wdk_System_SystemInformation", "Win32_System_Registry"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop", "Win32_NetworkManagement_NetManagement"] }
