[package]
name = "installation-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
sha2.workspace = true
constant_time_eq = "=0.4.2"

# ref: sha2 0.10.9 src/sha256.rs and src/sha256/aarch64.rs: the ARM
# hardware backend is gated by asm and still checks CPU support before use.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
cc = "=1.4.5"
