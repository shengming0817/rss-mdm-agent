[package]
name = "execution-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
test-support = ["execution-app/test-support"]

[dependencies]
execution-app = { path = "../execution-app" }
platform-private-storage = { path = "../platform-private-storage" }
execution-contract = { path = "../execution-contract" }
execution-admission = { path = "../execution-admission" }
execution-approval = { path = "../execution-approval" }
execution-lifecycle = { path = "../execution-lifecycle" }
execution-interaction = { path = "../execution-interaction" }
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Integration tests consume the library, where cfg(test) is not enabled.
execution-sqlite = { path = ".", features = ["test-support"] }

[[test]]
name = "acceptance"
path = "../../tests/execution-sqlite/acceptance.rs"

[lints.clippy]
cognitive_complexity = "warn"
