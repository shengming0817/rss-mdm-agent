.store-art {
  position: relative;
  height: 180px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: #edf0e9;
}
.paper {
  position: relative;
  width: 66%;
  height: 140px;
  padding: 24px 20px;
  background: #fffcf3;
  box-shadow: 0 12px 25px #4033210a;
  transform: rotate(8deg) translateY(10px);
}
.paper span {
  font:
    23px Georgia,
    serif;
  color: #8b7e5e;
  white-space: nowrap;
}
.paper i {
  display: block;
  height: 2px;
  background: #d8cfba;
  margin-top: 12px;
}
.paper i:last-child {
  width: 70%;
}
.store-art small {
  position: absolute;
  right: 5%;
  top: 22px;
  transform: rotate(-10deg);
  padding: 9px 15px;
  border-radius: 4px;
  background: #ecd599;
  color: #97814b;
  font-size: 10px;
}
.store-art.notes,
.store-art.pdf {
  background: #f2eee3;
}
.store-art.design {
  background: #eeebf4;
}
.design-board {
  display: flex;
  gap: 8px;
  width: 76%;
  height: 135px;
  padding: 12px;
  border-radius: 8px;
  background: white;
  transform: rotate(-5deg) translateY(15px);
  box-shadow: 0 14px 20px #29213c09;
}
.design-board i {
  width: 50%;
  border-radius: 5px;
  background: #b4c6bd;
}
.design-board span {
  display: grid;
  place-items: center;
  flex: 1;
  background: #e7cfbc;
  border-radius: 5px;
  font:
    40px Georgia,
    serif;
  color: #a97c62;
}
.swatches {
  display: flex;
  position: absolute;
  bottom: 23px;
  right: 7%;
  padding: 8px;
  gap: 5px;
  border-radius: 6px;
  background: white;
  transform: rotate(6deg);
}
.swatches i {
  width: 17px;
  height: 17px;
  background: #b1a2c8;
  border-radius: 50%;
}
.swatches i:nth-child(2) {
  background: #d6b29a;
}
.swatches i:nth-child(3) {
  background: #a8bfb3;
}
.store-art.browser {
  background: #e6eeee;
}
.browser-window {
  width: 80%;
  border-radius: 8px;
  overflow: hidden;
  transform: rotate(5deg) translateY(18px);
}
.browser-window header {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 22px;
  padding-left: 10px;
  background: #fbfdfd;
  color: #c8d2d4;
  font-size: 10px;
}
.browser-window header i {
  height: 6px;
  width: 65%;
  border-radius: 3px;
  background: #e8eeee;
}
.browser-window > div {
  height: 120px;
  background: linear-gradient(165deg, #d5e5e5 50%, #acc8be 50%);
  position: relative;
}
.browser-window span {
  position: absolute;
  width: 40px;
  height: 40px;
  background: #f5e9c9;
  border-radius: 50%;
  left: 25%;
  top: 14px;
}
.browser-window > div i {
  position: absolute;
  right: 0;
  bottom: -35px;
  background: #6c8f80;
  width: 65%;
  height: 110px;
  border-radius: 50%;
}
.workspace-window {
  display: flex;
  width: 78%;
  height: 135px;
  border: 9px solid white;
  border-radius: 8px;
  background: white;
  transform: rotate(-6deg) translateY(15px);
  box-shadow: 0 12px 30px #34493908;
}
.workspace-window .art-side {
  width: 24%;
  padding: 7px;
  background: #f2f3f4;
}
.workspace-window i {
  display: block;
  background: #d5dadd;
  height: 4px;
  margin: 9px 0;
  border-radius: 4px;
}
.workspace-window .art-main {
  flex: 1;
  padding: 0 12px;
}
.workspace-window .art-main i {
  margin: 15px 0;
  background: #e7e9ec;
}
.workspace-window .art-main i:first-child {
  background: #acb9ab;

function composer(id,compact=false){return `<div class="composer-wrap">${state.contextEnabled?`<span class="context-chip">${icon('system')}当前上下文：${esc(state.page==='assistant'?'本机设备与当前会话':navs.find(n=>n[0]===state.page)?.[1]||'应用设置')}<button class="icon-btn" style="width:16px;height:16px" data-action="remove-context" aria-label="移除页面上下文">${icon('close')}</button></span>`:`<button class="link" style="font-size:10px;margin-bottom:7px" data-action="add-context">＋ 附上当前页面上下文</button>`}<form class="composer" data-chat-form="${id}"><label class="sr" for="${id}">输入给电脑助手的消息</label><textarea id="${id}" placeholder="${compact?'描述这个页面里遇到的问题…':'描述你想做的事情…'}" maxlength="4000" rows="2" ${state.scene==='offline'?'aria-describedby="offline-draft-note"':''}>${esc(state.chatDraft)}</textarea><div class="composer-bottom"><span>Enter 发送 · Shift Enter 换行</span>${state.chatBusy?`<button type="button" class="send" data-action="stop-chat" aria-label="停止生成">${icon('stop')}</button>`:`<button class="send" aria-label="发送消息" ${state.scene==='offline'?'disabled':''}>${icon('up')}</button>`}</div></form><p class="composer-note" id="${compact?'companion-note':'offline-draft-note'}">${state.scene==='offline'?'连接中断，草稿保留。重新连接后可继续发送。':'AI 提供建议；实际执行与结果以设备服务为准。'}</p></div>`}
function assistant(){return `<div class="chat-layout ${state.historyOpen?'history-pinned':''}">${historyPanel()}<section class="chat-panel" aria-label="AI 会话">${state.scene==='readonly'?`<div style="padding:12px 22px 0">${banner()}</div>`:''}<div class="messages" id="chat-messages" aria-live="polite">${state.scene==='empty'?'':state.messages.map(messageMarkup).join('')}${!state.messages.length||state.scene==='empty'?`<div class="companion-intro"><div class="ai-symbol">${icon('spark')}</div><h3>今天想一起处理什么？</h3><p>描述问题，或从一个常见任务开始。</p>${['帮我检查企业网络连接','有哪些可以安装的办公应用？','帮我更新 VS Code'].map(p=>`<button class="suggestion" data-prompt="${p}">${p}${icon('arrow')}</button>`).join('')}</div>`:''}${state.chatBusy?'<div class="message assistant"><span class="message-avatar">'+icon('spark')+'</span><div class="typing" aria-label="正在生成回复"><i></i><i></i><i></i></div></div>':''}</div>${composer('chat-input')}</section></div>`}
function renderCompanion(){const el=$('#companion');el.hidden=!state.companion;if(!state.companion)return;el.innerHTML=`<header class="chat-top"><div><h2 class="flex">${icon('spark')}页面助手</h2><p>当前页面：${navs.find(n=>n[0]===state.page)?.[1]||'RSS Agent 设置'}</p></div><div class="flex"><button class="icon-btn" data-action="full-chat" title="在 AI 助手中继续" aria-label="在 AI 助手中继续">${icon('external')}</button><button class="icon-btn" data-action="close-companion" aria-label="关闭页面助手">${icon('close')}</button></div></header><div class="messages" id="companion-messages">${state.companionStarted?state.messages.slice(-4).map(messageMarkup).join(''):`<div class="companion-intro" style="padding:4px"><div class="ai-symbol">${icon('spark')}</div><h3>一起看看这个页面。</h3><p>附上当前页面的展示信息，帮助说明问题。不会附带未提交的表单或私密字段。</p>${['帮我解释当前页面的状态','我应该先处理哪一项任务？','帮我检查企业网络连接'].map(p=>`<button class="suggestion" data-side-prompt="${p}">${p}${icon('arrow')}</button>`).join('')}</div>`}${state.chatBusy?'<div class="typing"><i></i><i></i><i></i></div>':''}</div>${composer('side-chat-input',true)}`}
function render(){const active=document.activeElement;const focusId=active?.id;const selection=active&&['TEXTAREA','INPUT'].includes(active.tagName)?[active.selectionStart,active.selectionEnd]:null;const chatScrolls=['chat-messages','companion-messages'].map(id=>({id,top:$('#'+id)?.scrollTop}));renderChrome();const scroll=$('#main').scrollTop;$('#main').innerHTML=({home,software,tasks,system,tools,settings,assistant}[state.page]||home)();$('#main').scrollTop=scroll;renderCompanion();if(state.drawerType==='task'&&$('#drawer').open)updateTaskDrawer();if(focusId&&!$('#drawer').open&&!$('#modal').open&&!$('#palette').open){const next=$('#'+CSS.escape(focusId));if(next&&next!==active){next.focus({preventScroll:true});if(selection&&selection[0]!==null)try{next.setSelectionRange(...selection)}catch{}}}for(const x of chatScrolls){const el=$('#'+x.id);if(el&&x.top!==undefined)el.scrollTop=x.top;}}
function requestNavigate(page,section){const proceed=()=>navigate(page,section);if(state.dirty&&(page!=='system'||(section&&section!=='network'))){confirmDialog('要离开未保存的设置吗？','当前网络设置尚未保存。继续编辑会保留草稿；放弃后再离开。','放弃更改',()=>{state.networkDraft=structuredClone(state.networkSaved);state.dirty=false;proceed()},'继续编辑');return}proceed()}
function navigate(page,section){rememberSession();state.page=page;if(page==='system'&&section)state.systemSection=section;if(page==='settings'&&section)state.settingsSection=section;if(page==='software'){if(section?.startsWith('detail:')){state.softwareDetail=section.slice(7);state.softwareDetailTab='overview'}else{state.softwareDetail=null;if(section)state.softwareTab=['discover','installed','updates'].includes(section)||section.startsWith('category:')?section:'discover'}}state.companion=page==='assistant'?false:state.companion;if(innerWidth<=960&&state.layout==='full'){state.layout='rail';state.layoutStep=3}$('#main').scrollTop=0;if($('#drawer').open)closeDrawer();render();saveNavPreferences();$('#main h1')?.focus({preventScroll:true});if(page==='assistant')scrollChat();}
function closeDrawer(){const d=$('#drawer');if(d.open)d.close();state.drawerType=null;state.drawerId=null;}
function openDrawer(type,id,titleText,subtitle,body,footer=''){state.drawerType=type;state.drawerId=id;$('#drawer').innerHTML=`<div class="drawer-head"><div><h2 id="drawer-title">${titleText}</h2><p>${subtitle}</p></div><button class="icon-btn" data-action="close-drawer" aria-label="关闭详情">${icon('close')}</button></div><div class="drawer-body">${body}</div>${footer?`<div class="drawer-footer">${footer}</div>`:''}`;if(!$('#drawer').open)$('#drawer').showModal();}
function openApp(id,update=false){const a=apps.find(a=>a.id===id);if(!a)return;const pending=state.tasks.find(t=>t.app===id&&isActive(t));const body=`<div class="flex mb">${appIcon(a)}<div class="grow"><h3>${a.name}</h3><p class="muted small">${a.vendor} · ${a.category}</p></div>${tag(a.installed?'已安装':'可安装',a.installed?'':'green')}</div><p class="muted small" style="line-height:1.9">${a.desc}</p><dl class="detail-grid"><dt>当前版本</dt><dd class="mono">${a.installed?a.version:'尚未安装'}</dd>${a.next?`<dt>更新版本</dt><dd class="mono">${a.next}</dd>`:''}<dt>安装范围</dt><dd>当前用户 · XH-WORK-018</dd><dt>发布来源</dt><dd>星河科技 · 企业软件目录</dd><dt>下载大小</dt><dd>${a.size}</dd><dt>观察时间</dt><dd>今天 ${state.lastRefresh}</dd></dl>${a.next?`<h3>这次更新</h3><p class="muted small mt">更新到企业发布的固定版本，保留当前安装范围。示例版本仅用于体验流程。</p><div class="notice amber mt">${icon('info')}更新过程中可能关闭正在运行的应用，请先保存工作。</div>`:''}${pending?`<div class="notice info mt">${icon('tasks')}<div>已有原任务 ${pending.id}：${statusMap[pending.status][0]}。可查询原记录，无需重复提交。</div></div>`:''}${writeBlocked()?`<div class="notice ${state.scene==='readonly'?'info':'amber'} mt">${icon('lock')}${state.scene==='readonly'?'当前账号无执行权限。':'服务尚未就绪，当前不能提交操作。'}</div>`:''}`;const footer=`<span class="small">${a.installed?'原记录保留 · 不离开列表':'使用企业发布的软件'}</span><button class="btn" data-action="close-drawer">关闭</button>${pending?`<button class="btn primary" data-task="${pending.id}">查看原任务</button>`:a.next||!a.installed?`<button class="btn primary" data-start-app="${id}" ${disabledAttr()}>${a.installed?'开始更新':'开始安装'}</button>`:''}`;openDrawer('app',id,a.name,update?'核对版本与作用范围，再开始更新':'软件详情',body,footer)}
function taskBody(t){const status=taskTag(t);return `<div class="between mb"><div><h3>${t.name}</h3><span class="mono muted">${t.id}</span></div>${status}</div><div class="notice ${t.status==='success'?'green':t.status==='failed'?'red':['unknown','verifying'].includes(t.status)?'amber':'info'}">${icon(t.status==='success'?'checkcircle':'info')}<div>${esc(t.note)}</div></div><dl class="detail-grid"><dt>来源</dt><dd>${tag(t.source,t.source==='AI'?'purple':'')}</dd><dt>执行主体</dt><dd>林舟 · 当前用户</dd><dt>目标设备</dt><dd>XH-WORK-018</dd><dt>更新时间</dt><dd>今天 ${t.at}</dd><dt>请求身份</dt><dd class="mono">req-demo-${t.id.toLowerCase()}</dd></dl><h3>处理过程</h3><ol class="timeline">${t.events.map(([a,b],i)=>`<li class="${i===t.events.length-1&&isActive(t)?'current':'done'}"><strong style="font-weight:550">${esc(a)}</strong><p>${esc(b)}</p></li>`).join('')}</ol>${t.status==='unknown'?`<div class="notice amber">${icon('info')}<div>查询将使用同一个原请求，不会创建新的任务。没有实际核实结果前，不显示成功。</div></div>`:''}<details><summary>查看原始状态信息</summary><p class="mono">task: ${t.id}<br>phase: ${t.status}<br>source: ${t.source}<br>verified: ${t.status==='success'?'true':'false'}</p></details>`}
function taskFooter(t){return `<button class="btn" data-action="close-drawer">关闭</button>${['unknown','verifying'].includes(t.status)?`<button class="btn primary" data-reconcile="${t.id}" ${state.scene==='offline'?'disabled':''}>${icon('refresh')}查询原请求</button>`:['queued','running'].includes(t.status)?`<button class="btn" data-cancel-task="${t.id}">取消任务</button>`:t.status==='failed'?`<button class="btn" data-nav="tools">查看诊断工具</button>`:''}`}
function openTask(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;openDrawer('task',id,'任务详情','原请求、执行过程与核实结果',taskBody(t),taskFooter(t))}
function updateTaskDrawer(){const t=state.tasks.find(t=>t.id===state.drawerId);if(!t)return;const body=$('.drawer-body',$('#drawer'));const scroll=body.scrollTop;body.innerHTML=taskBody(t);body.scrollTop=scroll;$('.drawer-footer',$('#drawer')).innerHTML=taskFooter(t)}
function confirmDialog(titleText,desc,confirmText,onConfirm,cancelText='取消'){const d=$('#modal');d.innerHTML=`<h2 id="modal-title">${titleText}</h2><p>${desc}</p><div class="modal-actions"><button class="btn" id="modal-cancel">${cancelText}</button><button class="btn primary" id="modal-confirm">${confirmText}</button></div>`;$('#modal-cancel').onclick=()=>d.close();$('#modal-confirm').onclick=()=>{d.close();onConfirm()};if(!d.open)d.showModal();$('#modal-cancel').focus()}
function createTask(name,{app=null,source='人工',kind='software',onSuccess=null}={}){if(writeBlocked()){toast('当前状态不能提交操作，请先恢复连接或取得执行权限。',true);return null}if(app){const existing=state.tasks.find(t=>t.app===app&&isActive(t));if(existing){toast('已有进行中的原任务，已为你打开。');openTask(existing.id);return existing}}const t={id:'T-'+state.taskCounter++,name,app,source,kind,status:'queued',progress:10,at:'14:33',note:'任务已接收，等待设备服务处理。',events:[['任务已接收','14:33:00 · 已绑定当前用户和设备']],token:1,onSuccess};state.tasks.unshift(t);const token=t.token;const step=(ms,fn)=>setTimeout(()=>{if(t.token!==token)return;if(state.scene==='offline'){t.status='unknown';t.progress=60;t.note='连接已中断，执行结果尚未确认。请恢复连接后查询原请求。';t.events.push(['连接中断','结果未知 · 保留原请求']);t.token++;render();return}fn();render()},ms);step(950,()=>{t.status='running';t.progress=45;t.note='设备服务正在执行，请勿重复提交。';t.events.push(['正在执行','14:33:01 · 已接收执行回执'])});step(2400,()=>{t.status='verifying';t.progress=86;t.note='执行已结束，正在读取实际状态。';t.events.push(['执行已结束','14:33:02 · 等待实际状态核实'])});step(4700,()=>{if(state.scene==='unknown'){t.status='unknown';t.note='尚未取得核实回执，无法确认结果。';t.events.push(['核实回执暂缺','结果未知 · 查询原请求即可']);return}t.status='success';t.progress=100;t.note='已读取实际状态，本次示例操作核实成功。';t.events.push(['结果已核实','14:33:04 · 实际状态符合预期']);if(app){const a=apps.find(a=>a.id===app);if(a){a.installed=true;if(a.next){a.version=a.next;delete a.next}}}onSuccess?.();if(state.preferences.notifications)toast(name+' · 已核实成功')});render();toast('任务已接收 · '+t.id);return t}
function startApp(id,source='人工'){const a=apps.find(a=>a.id===id);if(!a)return;const t=createTask(`${a.installed?'更新':'安装'} ${a.name}`,{app:id,source});if(t){if(source==='AI'){state.aiTaskId=t.id;state.aiConfirmed=true;render()}openTask(t.id)}}
function reconcile(id){const t=state.tasks.find(t=>t.id===id);if(!t||!['unknown','verifying'].includes(t.status))return;if(state.scene==='offline'){toast('请先恢复设备服务连接。',true);return}t.token=(t.token||0)+1;const token=t.token;t.status='verifying';t.note='正在重新查询同一个原请求和实际状态。';t.events.push(['正在重新核实','保留原请求身份，不重复执行']);render();toast('正在查询原请求 '+t.id);setTimeout(()=>{if(t.token!==token)return;t.status='success';t.progress=100;t.note='已取回原回执，实际状态核实成功。没有创建新任务。';t.events.push(['已取回原核实结果','14:34:01 · 核实成功']);t.onSuccess?.();if(t.app){const a=apps.find(a=>a.id===t.app);if(a?.next){a.version=a.next;delete a.next}}render();toast('已核实成功 · 原任务 '+id)},1500)}
function cancelTask(id){const t=state.tasks.find(t=>t.id===id);if(!t||!['queued','running'].includes(t.status))return;confirmDialog('取消这项任务？','会向原任务发送取消请求。收到实际终止回执前，任务不会直接显示为已取消。','请求取消',()=>{t.token=(t.token||0)+1;const token=t.token;t.status='cancelling';t.note='取消请求已接收，等待实际终止回执。';t.events.push(['取消请求已接收','等待设备服务确认']);render();setTimeout(()=>{if(t.token!==token)return;t.status='cancelled';t.note='设备服务已确认取消。已发生的外部效果不会因此自动回滚。';if(state.networkPending===id){state.networkPending=null;updateNetworkDirty()}t.events.push(['已确认取消','收到设备服务终止回执']);render();toast('设备服务已确认取消 '+id)},1300)})}
const sessions=new Map();
function rememberSession(){sessions.set(state.session,{messages:structuredClone(state.messages),draft:state.chatDraft})}
function switchSession(id){if(state.chatBusy){toast('请先停止当前回复，再切换会话。',true);return}rememberSession();state.session=id;const saved=sessions.get(id);if(saved){state.messages=structuredClone(saved.messages);state.chatDraft=saved.draft}else{state.messages=id==='network'?[{role:'user',text:'企业网络访问正常吗？'},{role:'assistant',text:'上次只读诊断显示：Wi-Fi、DNS 与 HTTPS 均正常。可以再次发起诊断，读取最新的状态。',network:true}]:id==='help'?[{role:'user',text:'在哪里可以查看我的设备信息？'},{role:'assistant',text:'系统设置的“关于这台电脑”可以查看设备名称、系统版本、硬件与注册信息。',link:'system'}]:[];state.chatDraft=''}render();scrollChat()}
function scrollChat(){requestAnimationFrame(()=>{for(const id of ['chat-messages','companion-messages']){const el=$('#'+id);if(el)el.scrollTop=el.scrollHeight}})}
function sendMessage(text,side=false){text=text.trim();if(!text||state.chatBusy)return;if(state.scene==='offline'){toast('连接中断，草稿仍保留。',true);return}if(side&&!state.companionStarted){state.messages=[];state.companionStarted=true}if(state.scene==='empty'){$('#scene').value='normal';state.scene='normal'}state.messages.push({role:'user',text});state.chatDraft='';state.chatBusy=true;const generation=++state.chatGeneration;render();scrollChat();setTimeout(()=>{if(generation!==state.chatGeneration)return;state.chatBusy=false;const update=/更新|升级|VS Code|vscode/i.test(text),network=/网络|连接|DNS/i.test(text),software=/应用|软件|安装/.test(text);state.messages.push({role:'assistant',text:update?'我找到了企业发布的 VS Code 更新。请核对固定版本、作用范围和这一次具体动作，再决定是否执行。':network?'可以先做一次只读诊断，检查 Wi-Fi、DNS 和服务连接。它不会更改你的网络设置。':software?'你可以在软件中心的“发现”页查看公司发布的应用。打开应用详情后，能先核对发布来源和安装范围。':'当前页面的信息可以作为排查起点。建议先查看需要关注的任务，并核对原请求的实际结果；状态未知时，请查询原记录。',operation:update,network:!update&&network,link:!update&&!network?(software?'software':'tasks'):null});rememberSession();render();scrollChat()},1000)}
function stopChat(){state.chatGeneration++;state.chatBusy=false;state.messages.push({role:'assistant',text:'已停止生成。已经接收的设备任务仍会保留，可在任务中心单独查看或取消。'});render();scrollChat()}

function runTool(id){if(id==='space'){requestNavigate('system','storage');return}if(id==='power'){requestNavigate('system','power');return}if(id==='security'){requestNavigate('system','security');return}if(id==='recent'){requestNavigate('tasks');return}if(writeBlocked()&&['network','inventory'].includes(id)){toast('当前状态不能运行工具。',true);return}if(id==='inventory'){const t=createTask('采集本机软件清单',{kind:'query',onSuccess:()=>{state.lastRefresh='14:34'}});if(t)openTask(t.id);return}if(id==='diagnostics'){openDrawer('diagnostics',null,'诊断摘要','导出前先核对可共享的内容',`<div class="notice info mb">${icon('shield')}仅包含以下示例状态，不包含令牌、凭据、IP 地址或对话全文。</div><dl class="detail-grid"><dt>设备</dt><dd>XH-WORK-018</dd><dt>平台</dt><dd>${state.platform==='mac'?'macOS':'Windows'}</dd><dt>设备服务</dt><dd>${state.scene==='offline'?'离线':'已连接'}</dd><dt>AI Host</dt><dd>可用</dd><dt>任务数</dt><dd>${state.tasks.length}</dd><dt>结果未知</dt><dd>${state.tasks.filter(t=>t.status==='unknown').length}</dd></dl><p class="protocol-note">导出的 JSON 文件只包含本原型的演示数据。</p>`,`<button class="btn" data-action="close-drawer">关闭</button><button class="btn primary" data-action="export-diagnostics">${icon('download')}导出示例摘要</button>`);return}state.toolBusy[id]=true;render();setTimeout(()=>{state.toolBusy[id]=false;state.toolResults[id]=id==='network'?'Wi-Fi：已连接 Xinghe-Office<br>DNS：解析正常 · 18 ms<br>HTTPS：连接正常 · 42 ms<br>结论：本次示例未发现连接异常。':(state.scene==='offline'?'设备服务：连接中断<br>正在显示保留状态，无法读取最新结果。':'设备服务：已连接<br>认证通道：可用<br>AI Host：可用<br>读取时间：今天 14:34');render();toast(id==='network'?'网络诊断结果已读取':'本机服务状态已读取')},1400)}
function exportDiagnostics(){const obj={prototype:true,device:'XH-WORK-018',platform:state.platform,service:state.scene==='offline'?'offline':'connected',taskCount:state.tasks.length,unknownCount:state.tasks.filter(t=>t.status==='unknown').length};download('rss-agent-example-diagnostics.json',JSON.stringify(obj,null,2),'application/json');toast('示例诊断摘要已导出')}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function updateNetworkDirty(){state.dirty=JSON.stringify(state.networkDraft)!==JSON.stringify(state.networkSaved);const label=$('#dirty-label');if(label)label.textContent=state.dirty?'有尚未保存的修改':'';const save=$('[data-action="proxy-save"]');if(save)save.disabled=writeBlocked()||state.networkPending||!state.dirty}
function saveProxy(){const d=state.networkDraft;if(d.enabled&&(!/^[a-zA-Z0-9.-]+$/.test(d.host)||!/^\d+$/.test(d.port)||Number(d.port)<1||Number(d.port)>65535)){toast('请填写有效服务器地址，以及 1–65535 之间的端口。',true);$('#proxy-host').focus();return}const values=structuredClone(d);const t=createTask('应用 HTTP 代理设置',{kind:'settings',onSuccess:()=>{state.networkSaved=values;state.networkPending=null;if(JSON.stringify(state.networkDraft)===JSON.stringify(values))state.dirty=false}});if(t){state.dirty=false;state.networkPending=t.id;render();openTask(t.id)}}
function openConnection(name){openDrawer('connection',name,`${name} 连接`,'连接配置 · 仅为演示，不保存真实秘密',`<div class="stack"><div class="field"><label for="connection-name">显示名称</label><input class="input" id="connection-name" value="${name} · 工作连接" maxlength="80"></div><div class="field"><label for="connection-origin">认证来源</label><select id="connection-origin"><option>已有工作账号</option><option>自定义 API（仅演示选择）</option></select></div><div class="notice info">${icon('lock')}此原型不收集 API 密钥，也不会实际发起认证或测试请求。</div><div id="connection-feedback"></div></div>`,`<button class="btn" data-action="close-drawer">关闭</button><button class="btn primary" data-action="test-connection" ${disabledAttr()}>测试示例连接</button>`)}
function showSpec(){openDrawer('spec',null,'布局与 UX 说明','方案 v4 · 导航位置与切换顺序修正',`<div class="spec-hero"><h3>软件功能集中，导航位置稳定。</h3><p>“发现”归回软件中心；打开、查看和卸载合并在已安装页面。任务中心保持一级入口，仅移动到系统设置下方。</p></div><section class="spec-section"><h3>01 / 一级导航</h3><p>主页 → AI 助手 → 软件中心 → 工具中心 → 系统设置 → 任务中心。账号与偏好通过用户入口进入，不单列设置菜单。</p></section><section class="spec-section"><h3>02 / 软件中心</h3><ul><li>发现：保留原有精选横幅、封面卡片与公司发布的应用目录。</li><li>已安装：本机软件的查看、打开、卸载集中处理；不再单列“卸载”。</li><li>更新：本机已安装软件的固定更新候选。</li><li>效率办公、创意设计、网络工具、开发工具、系统工具五类二级菜单继续保留。</li><li>不新增独立“发现”一级入口，不恢复企业软件或操作记录入口，不使用含义不明的“全部应用”。</li></ul></section><section class="spec-section"><h3>03 / 侧栏方向与稳定位置</h3><p>循环顺序严格为：无 → 小 → 宽 → 小 → 无。小侧栏分为展开途中与收回途中两个状态，不能简单做三个状态循环。</p><p>RSS 标识在所有布局下保留。顶栏左侧的标识和切换按钮置于固定宽度区域，不受隐藏导航、标题或搜索区出现与否影响。</p><p>无侧栏时，主导航图标、二级菜单和用户入口仍可使用。⌘/Ctrl B 可隐藏或恢复之前的侧栏状态；按钮循环和恢复快捷键各自保持清晰行为。</p></section><section class="spec-section"><h3>04 / 保留的交互</h3><ul><li>各模块记住上次的二级选择。</li><li>历史会话由二级入口直接固定展开，没有固定按钮；AI 内容区不再增加顶部菜单。</li><li>任务中心有自己的进行中、历史记录和管理活动视图，不归入系统设置的二级分类。</li><li>安装、更新和卸载均查询原任务并区分实际核实结果；受组织保护的软件不可卸载。</li></ul></section><section class="spec-section"><h3>05 / 验证边界</h3><p>本文件是离线交互原型，全部数据和操作均为演示。页面内容、草稿、权限和设备状态仍需生产实现后的实际验证。</p></section>`,`<button class="btn" data-action="reset-demo">重置演示</button><button class="btn primary" data-action="close-drawer">继续体验</button>`)}
function setScene(scene){state.scene=scene;$('#scene').value=scene;if(scene==='unknown'){let t=state.tasks.find(t=>t.id==='T-1042');t.token=(t.token||0)+1;t.status='unknown';t.note='安装进程已结束，但尚未取得实际版本核实回执。请查询原请求。';t.events=[['任务已接收','14:28:00 · 绑定当前用户和设备'],['执行已结束','14:28:12 · 原进程正常结束'],['核实回执暂缺','结果未知，不能据此显示成功']];state.page='tasks';state.taskTab='active'}render();if(state.drawerType==='app')openApp(state.drawerId);toast({normal:'已恢复正常演示状态',offline:'已切换为离线缓存状态',loading:'正在演示读取中的状态',empty:'正在演示空数据状态',error:'正在演示读取失败状态',readonly:'正在演示只读权限',unknown:'已准备结果未知的任务，点击详情体验重查'}[scene]);}

document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.nav){requestNavigate(d.nav,d.section);return}if(d.action){actions[d.action]?.();return}if(d.secondary){selectSecondary(d.secondary,d.section);return}if(d.softwareBack){state.softwareDetail=null;render();$('#main h1')?.focus();return}if(d.detailTab){state.softwareDetailTab=d.detailTab;render();return}if(d.softwareLayout){state.softwareLayout=d.softwareLayout;render();return}if(d.quickApp){openApp(d.quickApp);return}if(d.launchApp){toast('预览：打开 '+apps.find(a=>a.id===d.launchApp)?.name+'，未启动真实应用。');return}if(d.uninstallApp){uninstallApp(d.uninstallApp);return}if(d.appHelp){state.chatDraft=apps.find(a=>a.id===d.appHelp)?.name+' 无法连接，请帮我检查问题';requestNavigate('assistant');return}if(d.app){openSoftwareDetail(d.app);return}if(d.update){openApp(d.update,true);return}if(d.startApp){startApp(d.startApp);return}if(d.task){openTask(d.task);return}if(d.reconcile){reconcile(d.reconcile);return}if(d.cancelTask){cancelTask(d.cancelTask);return}if(d.softwareTab){selectSecondary('software',d.softwareTab);return}if(d.taskTab){state.taskTab=d.taskTab;render();saveNavPreferences();return}if(d.systemSection){requestNavigate('system',d.systemSection);return}if(d.settingsSection){requestNavigate('settings',d.settingsSection);return}if(d.tool){runTool(d.tool);return}if(d.toolsCategory){state.toolsCategory=d.toolsCategory;render();saveNavPreferences();return}if(d.prompt){if(state.page!=='assistant'){state.chatDraft=d.prompt;requestNavigate('assistant');toast('草稿已带入，发送前可以继续编辑');$('#chat-input')?.focus()}else sendMessage(d.prompt);return}if(d.sidePrompt){sendMessage(d.sidePrompt,true);return}if(d.session){if(!state.historyPinned)state.historyOpen=false;switchSession(d.session);if(!state.historyOpen)$('#chat-input')?.focus();return}if(d.connection){openConnection(d.connection);return}if(d.searchResult!==undefined){selectPalette(Number(d.searchResult));return}});

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#drawer').open&&!$('#modal').open)openPalette();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){e.preventDefault();toggleSidebarVisibility();return}if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&['chat-input','side-chat-input'].includes(e.target.id)){e.preventDefault();sendMessage(e.target.value,e.target.id==='side-chat-input');return}if($('#palette').open){if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();state.paletteIndex=Math.max(0,Math.min(state.paletteItems.length-1,state.paletteIndex+(e.key==='ArrowDown'?1:-1)));paletteResults();$('.palette-result.selected')?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();selectPalette(state.paletteIndex)}}if(e.key==='Escape'&&state.historyOpen&&!state.historyPinned&&!$('#drawer').open&&!$('#modal').open&&!$('#palette').open){e.preventDefault();closeHistory(true);return}if(e.key==='Escape'&&$('#app').classList.contains('nav-open')){setLayout('rail');$('#nav-toggle').focus();return}if(e.key==='Escape'&&state.companion&&!$('#drawer').open&&!$('#modal').open&&!$('#palette').open){state.companion=false;renderCompanion();$('#companion-button').focus()}});
